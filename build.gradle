plugins {
    id 'application'
    id "org.sonarqube" version "7.3.1.8318"

}

sonar {
  properties {
    property "sonar.projectName", "deprecated-java-api-demo-1"
    property "sonar.links.scm", "https://github.com/sourcegraph-testing/deprecated-java-api-demo-1"
  }
}

group = 'dev.trly.java.example.primitive.wrappers'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'org.slf4j:slf4j-api:2.0.16'
}

application {
    mainClass = 'dev.trly.java.example.primitive.wrappers.LaunchChecklistApp'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:removal'])
}
